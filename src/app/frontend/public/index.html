<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f6f4fb">
    <title>roommate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="screen">
        <header class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3.5 12 12 4.5l8.5 7.5"/>
                <circle cx="12" cy="16.5" r="1.8" fill="currentColor" stroke="none"/>
            </svg>
            roommate
        </header>

        <section id="loading-view" class="view view-loading">
            <div class="spinner" role="status" aria-label="loading"></div>
        </section>

        <section id="username-view" class="view" hidden>
            <h1>pick a<br><em>username</em></h1>
            <form id="username-form" novalidate>
                <label for="username" class="sr-only">username</label>
                <input id="username" type="text" autocomplete="username" autocapitalize="none"
                       spellcheck="false" maxlength="150" placeholder="username" required>
                <p id="username-error" class="error" role="alert"></p>
                <button id="username-submit" type="submit">continue</button>
            </form>
        </section>

        <section id="welcome-view" class="view view-welcome" hidden>
            <div>
                <div id="avatar" class="avatar" aria-hidden="true"></div>
                <h1 id="welcome">welcome</h1>
                <p class="sub">good to have you home.</p>
            </div>
            <section class="houses" aria-labelledby="houses-title" aria-live="polite">
                <h2 id="houses-title">your houses</h2>
                <p id="houses-message" class="sub" hidden></p>
                <ul id="houses-list" class="tiles"></ul>
            </section>
        </section>
    </main>

    <script src="js/user-login.js"></script>
    <script src="js/local-auth.js"></script>
</body>
</html>
