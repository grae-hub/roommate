server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://roommate-backend-service:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        # always revalidate so a redeploy is never masked by a stale cached js/html file
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}