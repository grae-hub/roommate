env: "local"

frontend:
  name: roommate-frontend
  deployment:
    strategy: Recreate
    replicas: 2
    containerName: frontend
    containerImage: grae888/roommate-frontend
    containerPorts:
      - name: http
        containerPort: 80
    cpuMin: 100m
    cpuMax: 300m
    memMin: 128Mi
    memMax: 256Mi
    storageMin: 100Mi
    storageMax: 1Gi
  service:
    type: NodePort
    ports:
      - name: http
        port: 80
        targetPort: 80
        nodePort: 30080

redis:
  name: roommate-redis
  deployment:
    strategy: Recreate
    replicas: 2
    containerName: redis
    containerImage: redis:7-alpine
    containerPorts:
      - name: redis
        containerPort: 6379
    cpuMin: 100m
    cpuMax: 300m
    memMin: 128Mi
    memMax: 256Mi
    storageMin: 100Mi
    storageMax: 1Gi
  service:
    type: ClusterIP
    ports:
      - name: redis
        port: 6379
        targetPort: 6379

backend:
  name: roommate-backend
  env:
    dbHost: host.docker.internal
    dbPort: "5432"
    dbName: roommate
    dbUser: roommate
    dbPassword: roommate
  deployment:
    strategy: Recreate
    replicas: 2
    containerName: backend
    containerImage: grae888/roommate-backend
    containerPorts:
      - name: backend-http
        containerPort: 8080
    cpuMin: 100m
    cpuMax: 300m
    memMin: 128Mi
    memMax: 256Mi
    storageMin: 100Mi
    storageMax: 1Gi
  service:
    type: ClusterIP
    ports:
      - name: backend-http
        port: 8080
        targetPort: 8080