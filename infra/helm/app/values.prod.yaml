env: "prod"

frontend:
  name: roommate-frontend
  deployment:
    strategy: RollingUpdate
    replicas: 2
    containerName: frontend
    containerImage: grae888/roommate-frontend
    containerPorts:
      - name: http
        containerPort: 80
    cpuMin: 100m
    cpuMax: 600m
    memMin: 128Mi
    memMax: 512Mi
    storageMin: 100Mi
    storageMax: 2Gi
  service:
    type: ClusterIP
    ports:
      - name: http
        port: 80
        targetPort: 80
  ingress:
    paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: roommate-service
            port:
              number: 80
    certificateArn: ""
    cognito:
      userPoolArn: ""
      userPoolClientId: ""
      userPoolDomainPrefix: ""

redis:
  name: roommate-redis
  deployment:
    strategy: RollingUpdate
    replicas: 2
    containerName: redis
    containerImage: redis:7-alpine
    containerPorts:
      - name: redis
        containerPort: 6379
    cpuMin: 100m
    cpuMax: 300m
    memMin: 128Mi
    memMax: 256Mi
    storageMin: 100Mi
    storageMax: 1Gi
  service:
    type: ClusterIP
    ports:
      - name: redis
        port: 6379
        targetPort: 6379

backend:
  name: roommate-backend
  env:
    dbHost: ""
    dbPort: "5432"
    dbName: ""
    dbUser: ""
    dbPassword: ""
  deployment:
    strategy: RollingUpdate
    replicas: 2
    containerName: backend
    containerImage: grae888/roommate-backend
    containerPorts:
      - name: backend-http
        containerPort: 8080
    cpuMin: 100m
    cpuMax: 300m
    memMin: 128Mi
    memMax: 256Mi
    storageMin: 100Mi
    storageMax: 1Gi
  service:
    type: ClusterIP
    ports:
      - name: backend-http
        port: 8080
        targetPort: 8080