appName: ""
nodeRole: ""

nodeClass:
  name: default
  amiAlias: al2023@latest
  maxPods: 4

nodePool:
  name: default
  capacityTypes:
    - spot
  architectures:
    - amd64
  instanceCategories:
    - t
  cpuLimit: 8
  memLimit: 16Gi
  consolidationPolicy: WhenEmptyOrUnderutilized
  consolidateAfter: 1m