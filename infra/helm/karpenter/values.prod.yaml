appName: ""
nodeRole: ""

nodeClass:
  name: default
  amiAlias: al2023@latest
  maxPods: 6

nodePool:
  name: default
  capacityTypes:
    - spot
    - on-demand
  architectures:
    - amd64
  instanceCategories:
    - t
    - m
  cpuLimit: 16
  memLimit: 32Gi
  consolidationPolicy: WhenEmptyOrUnderutilized
  consolidateAfter: 1m