apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-karpenter
spec:
  replicas: 10
  selector:
    matchLabels:
      app: test-karpenter
  template:
    metadata:
      name: test-karpenter
      labels:
        app: test-karpenter
    spec:
      containers:
        - name: inflate
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.7
          resources:
            requests:
              cpu: "0.1"
              memory: "50Mi"
              ephemeral-storage: "10Mi"
            limits:
              cpu: "0.2"
              memory: "100Mi"
              ephemeral-storage: "50Mi"