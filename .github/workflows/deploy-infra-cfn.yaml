name: deploy cfn

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    outputs:
      vpc_id:
        value: ${{ jobs.deploy.outputs.vpc_id }}
      cluster_name:
        value: ${{ jobs.deploy.outputs.cluster_name }}
      certificate_arn:
        value: ${{ jobs.deploy.outputs.certificate_arn }}
      controller_role_arn:
        value: ${{ jobs.deploy.outputs.controller_role_arn }}
      node_role:
        value: ${{ jobs.deploy.outputs.node_role }}
      node_role_name:
        value: ${{ jobs.deploy.outputs.node_role_name }}
      user_pool_arn:
        value: ${{ jobs.deploy.outputs.user_pool_arn }}
      user_pool_client_id:
        value: ${{ jobs.deploy.outputs.user_pool_client_id }}
      user_pool_domain_prefix:
        value: ${{ jobs.deploy.outputs.user_pool_domain_prefix }}
      db_endpoint_address:
        value: ${{ jobs.deploy.outputs.db_endpoint_address }}
      db_port:
        value: ${{ jobs.deploy.outputs.db_port }}
      db_name:
        value: ${{ jobs.deploy.outputs.db_name }}
      db_iam_username:
        value: ${{ jobs.deploy.outputs.db_iam_username }}
      db_access_role_arn:
        value: ${{ jobs.deploy.outputs.db_access_role_arn }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      vpc_id: ${{ steps.networking.outputs.vpc_id }}
      cluster_name: ${{ steps.eks.outputs.cluster_name }}
      certificate_arn: ${{ steps.eks.outputs.certificate_arn }}
      controller_role_arn: ${{ steps.karpenter.outputs.controller_role_arn }}
      node_role: ${{ steps.karpenter.outputs.node_role }}
      node_role_name: ${{ steps.karpenter.outputs.node_role_name }}
      user_pool_arn: ${{ steps.cognito.outputs.user_pool_arn }}
      user_pool_client_id: ${{ steps.cognito.outputs.user_pool_client_id }}
      user_pool_domain_prefix: ${{ steps.cognito.outputs.user_pool_domain_prefix }}
      db_endpoint_address: ${{ steps.rds.outputs.db_endpoint_address }}
      db_port: ${{ steps.rds.outputs.db_port }}
      db_name: ${{ steps.rds.outputs.db_name }}
      db_iam_username: ${{ steps.rds.outputs.db_iam_username }}
      db_access_role_arn: ${{ steps.rds.outputs.db_access_role_arn }}
    environment: ${{ inputs.environment }}

    env:
      AWS_REGION: ap-southeast-2
      NETWORKING_STACK_NAME: roommate-networking-${{ vars.ENV_SHORTHAND }}
      EKS_STACK_NAME: roommate-eks-${{ vars.ENV_SHORTHAND }}
      KARPENTER_STACK_NAME: roommate-karpenter-${{ vars.ENV_SHORTHAND }}
      COGNITO_STACK_NAME: roommate-cognito-${{ vars.ENV_SHORTHAND }}
      RDS_STACK_NAME: roommate-rds-${{ vars.ENV_SHORTHAND }}
      LAMBDA_ARTIFACTS_STACK_NAME: roommate-lambda-artifacts-${{ vars.ENV_SHORTHAND }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: deploy networking cfn
        id: networking
        run: |
          aws cloudformation deploy \
            --stack-name "${NETWORKING_STACK_NAME}" \
            --template-file infra/cfn/networking.yaml \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Env="${{ vars.ENV_SHORTHAND }}" \
              VpcCidr="${{ vars.VPC_CIDR }}"
          
          echo "getting vpc id..."
          VPC_ID=$(aws cloudformation describe-stacks \
          --stack-name ${NETWORKING_STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue" \
          --output text)
          echo "vpc id: '$VPC_ID'"
          echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT

      - name: deploy eks cfn
        id: eks
        run: |
          aws cloudformation deploy \
            --stack-name "${EKS_STACK_NAME}" \
            --template-file infra/cfn/eks.yaml \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
            Env="${{ vars.ENV_SHORTHAND }}" \
            NetworkStackName="${NETWORKING_STACK_NAME}" \
            NodeInstanceType="${{ vars.NODE_INSTANCE_TYPE }}" \
            NodeDesiredSize="${{ vars.NODE_DESIRED_SIZE }}" \
            NodeMinSize="${{ vars.NODE_MIN_SIZE }}" \
            NodeMaxSize="${{ vars.NODE_MAX_SIZE }}" \
            DomainName="${{ vars.DOMAIN_NAME }}" \
            HostedZoneId="${{ secrets.HOSTED_ZONE_ID }}"

          echo "getting ingress certificate arn..."
          CERTIFICATE_ARN=$(aws cloudformation describe-stacks \
          --stack-name ${EKS_STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='CertificateArn'].OutputValue" \
          --output text)
          echo "certificate arn: '$CERTIFICATE_ARN'"
          echo "certificate_arn=$CERTIFICATE_ARN" >> $GITHUB_OUTPUT

          echo "getting cluster name..."
          CLUSTER_NAME=$(aws cloudformation describe-stacks \
          --stack-name ${EKS_STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue" \
          --output text)
          echo "cluster name: '$CLUSTER_NAME'"
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
      
      - name: deploy karpenter cfn
        id: karpenter
        run: |
          aws cloudformation deploy \
            --stack-name "${KARPENTER_STACK_NAME}" \
            --template-file infra/cfn/karpenter.yaml \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
            Env="${{ vars.ENV_SHORTHAND }}" \
            NetworkStackName="${NETWORKING_STACK_NAME}" \
            EksStackName="${EKS_STACK_NAME}"
          
          echo "getting karpenter controller role arn..."
          CONTROLLER_ROLE_ARN=$(aws cloudformation describe-stacks \
          --stack-name ${KARPENTER_STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='KarpenterControllerRoleArn'].OutputValue" \
          --output text)
          echo "karpenter controller role arn: '$CONTROLLER_ROLE_ARN'"
          echo "controller_role_arn=$CONTROLLER_ROLE_ARN" >> $GITHUB_OUTPUT

          echo "getting node role arn..."
          NODE_ROLE=$(aws cloudformation describe-stacks \
          --stack-name ${KARPENTER_STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='KarpenterNodeRoleArn'].OutputValue" \
          --output text)
          echo "node role arn: '$NODE_ROLE'"
          echo "node_role=$NODE_ROLE" >> $GITHUB_OUTPUT

          echo "getting node role name..."
          NODE_ROLE_NAME="${NODE_ROLE##*/}"
          echo "node role name: '$NODE_ROLE_NAME'"
          echo "node_role_name=$NODE_ROLE_NAME" >> $GITHUB_OUTPUT

      - name: deploy lambda artifacts bucket cfn
        id: lambda-artifacts
        run: |
          aws cloudformation deploy \
            --stack-name "${LAMBDA_ARTIFACTS_STACK_NAME}" \
            --template-file infra/cfn/lambda-artifacts.yaml \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
            Env="${{ vars.ENV_SHORTHAND }}"

          echo "getting lambda artifacts bucket name..."
          BUCKET_NAME=$(aws cloudformation describe-stacks \
          --stack-name ${LAMBDA_ARTIFACTS_STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
          --output text)
          echo "bucket name: '$BUCKET_NAME'"
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT

      - name: package rds bootstrap lambda
        id: rds-bootstrap-package
        run: |
          BUILD_DIR=$(mktemp -d)
          pip install --quiet -r infra/lambda/rds_bootstrap/requirements.txt --target "${BUILD_DIR}"
          cp infra/lambda/rds_bootstrap/handler.py "${BUILD_DIR}/"

          ZIP_PATH="${BUILD_DIR}.zip"
          (cd "${BUILD_DIR}" && zip -rq "${ZIP_PATH}" .)

          S3_KEY="rds-bootstrap/${{ github.sha }}.zip"
          aws s3 cp "${ZIP_PATH}" "s3://${{ steps.lambda-artifacts.outputs.bucket_name }}/${S3_KEY}"

          echo "s3_key=${S3_KEY}" >> $GITHUB_OUTPUT

      - name: deploy rds cfn
        id: rds
        run: |
          aws cloudformation deploy \
            --stack-name "${RDS_STACK_NAME}" \
            --template-file infra/cfn/rds.yaml \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
            Env="${{ vars.ENV_SHORTHAND }}" \
            NetworkStackName="${NETWORKING_STACK_NAME}" \
            EksStackName="${EKS_STACK_NAME}" \
            KarpenterStackName="${KARPENTER_STACK_NAME}" \
            DbInstanceClass="${{ vars.DB_INSTANCE_CLASS }}" \
            LambdaArtifactsBucket="${{ steps.lambda-artifacts.outputs.bucket_name }}" \
            LambdaCodeS3Key="${{ steps.rds-bootstrap-package.outputs.s3_key }}"

          echo "getting db endpoint address..."
          DB_ENDPOINT_ADDRESS=$(aws cloudformation describe-stacks \
          --stack-name ${RDS_STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='DbEndpointAddress'].OutputValue" \
          --output text)
          echo "db endpoint address: '$DB_ENDPOINT_ADDRESS'"
          echo "db_endpoint_address=$DB_ENDPOINT_ADDRESS" >> $GITHUB_OUTPUT

          echo "getting db port..."
          DB_PORT=$(aws cloudformation describe-stacks \
          --stack-name ${RDS_STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='DbPort'].OutputValue" \
          --output text)
          echo "db port: '$DB_PORT'"
          echo "db_port=$DB_PORT" >> $GITHUB_OUTPUT

          echo "getting db name..."
          DB_NAME=$(aws cloudformation describe-stacks \
          --stack-name ${RDS_STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='DbName'].OutputValue" \
          --output text)
          echo "db name: '$DB_NAME'"
          echo "db_name=$DB_NAME" >> $GITHUB_OUTPUT

          echo "getting db iam username..."
          DB_IAM_USERNAME=$(aws cloudformation describe-stacks \
          --stack-name ${RDS_STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='DbIamUsername'].OutputValue" \
          --output text)
          echo "db iam username: '$DB_IAM_USERNAME'"
          echo "db_iam_username=$DB_IAM_USERNAME" >> $GITHUB_OUTPUT

          echo "getting db access role arn..."
          DB_ACCESS_ROLE_ARN=$(aws cloudformation describe-stacks \
          --stack-name ${RDS_STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='DbAccessRoleArn'].OutputValue" \
          --output text)
          echo "db access role arn: '$DB_ACCESS_ROLE_ARN'"
          echo "db_access_role_arn=$DB_ACCESS_ROLE_ARN" >> $GITHUB_OUTPUT

      - name: deploy cognito cfn
        id: cognito
        run: |
          aws cloudformation deploy \
            --stack-name "${COGNITO_STACK_NAME}" \
            --template-file infra/cfn/cognito.yaml \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
            Env="${{ vars.ENV_SHORTHAND }}" \
            DomainName="${{ vars.DOMAIN_NAME }}" \
            GoogleClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
            GoogleClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}"

          echo "getting cognito user pool arn..."
          USER_POOL_ARN=$(aws cloudformation describe-stacks \
          --stack-name ${COGNITO_STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='UserPoolArn'].OutputValue" \
          --output text)
          echo "user pool arn: '$USER_POOL_ARN'"
          echo "user_pool_arn=$USER_POOL_ARN" >> $GITHUB_OUTPUT

          echo "getting cognito user pool client id..."
          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks \
          --stack-name ${COGNITO_STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
          --output text)
          echo "user pool client id: '$USER_POOL_CLIENT_ID'"
          echo "user_pool_client_id=$USER_POOL_CLIENT_ID" >> $GITHUB_OUTPUT

          echo "getting cognito user pool domain prefix..."
          USER_POOL_DOMAIN_PREFIX=$(aws cloudformation describe-stacks \
          --stack-name ${COGNITO_STACK_NAME} \
          --query "Stacks[0].Outputs[?OutputKey=='UserPoolDomainPrefix'].OutputValue" \
          --output text)
          echo "user pool domain prefix: '$USER_POOL_DOMAIN_PREFIX'"
          echo "user_pool_domain_prefix=$USER_POOL_DOMAIN_PREFIX" >> $GITHUB_OUTPUT